name: Generate Contribution Signal

on:
  schedule:
    - cron: "17 0 * * *" # Daily at 00:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate animated contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            dist/github-snake.svg?color_snake=%23F5C542&color_dots=%230B0D12,%231B1B1B,%23453516,%238B6B20,%23F5C542
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%23F5C542
            dist/github-snake.gif?color_snake=%23F5C542&color_dots=%230B0D12,%231B1B1B,%23453516,%238B6B20,%23F5C542&color_background=%230B0D12

      - name: Publish generated animations to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
