name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *" # Daily at 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate Gotham-themed contribution snakes
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            dist/github-snake.svg?palette=github&color_snake=F5C542&color_dots=1A1A1A,3E3210,7D621A,C49D2A,F5C542
            dist/github-snake-dark.svg?palette=github-dark&color_snake=F5C542&color_dots=1A1A1A,3E3210,7D621A,C49D2A,F5C542

      - name: Publish SVG files to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
